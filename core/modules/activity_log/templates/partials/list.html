{# activity_log/partials/list.html #}
<div id="tab-activity_log" class="tab-content">
  <div class="page-header">
    <div class="page-title">Activity Log</div>
    <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">

      <button class="btn btn-secondary"
              style="font-size:12px; padding:4px 10px; color:var(--err); border-color:var(--err);"
              hx-get="/api/activity_log/clear-confirm"
              hx-target="body"
              hx-swap="beforeend">
        Log leeren
      </button>

      <select class="form-select" style="font-size:12px; padding:4px 8px; width:auto;"
              name="log_type"
              hx-get="/api/activity_log/rows"
              hx-target="#activity-log-rows"
              hx-swap="innerHTML"
              hx-trigger="change"
              hx-include="[name='module'],[name='status'],[name='date_range'],[name='search']">
        <option value="">Alle Typen</option>
        <option value="job">Jobs</option>
        <option value="scheduler">Scheduler</option>
        <option value="error">Errors</option>
        <option value="warning">Warnings</option>
        <option value="system">System</option>
      </select>

      <select class="form-select" style="font-size:12px; padding:4px 8px; width:auto;"
              name="module"
              hx-get="/api/activity_log/rows"
              hx-target="#activity-log-rows"
              hx-swap="innerHTML"
              hx-trigger="change"
              hx-include="[name='log_type'],[name='status'],[name='date_range'],[name='search']">
        <option value="">Alle Module</option>
        {% for m in modules %}
        <option value="{{ m }}">{{ m.replace('_',' ').title() }}</option>
        {% endfor %}
      </select>

      <select class="form-select" style="font-size:12px; padding:4px 8px; width:auto;"
              name="status"
              hx-get="/api/activity_log/rows"
              hx-target="#activity-log-rows"
              hx-swap="innerHTML"
              hx-trigger="change"
              hx-include="[name='log_type'],[name='module'],[name='date_range'],[name='search']">
        <option value="">Alle Status</option>
        <option value="ok">OK</option>
        <option value="error">Fehler</option>
        <option value="warning">Warnung</option>
        <option value="running">Läuft</option>
        <option value="skipped">Übersprungen</option>
      </select>

      <select class="form-select" style="font-size:12px; padding:4px 8px; width:auto;"
              name="date_range"
              hx-get="/api/activity_log/rows"
              hx-target="#activity-log-rows"
              hx-swap="innerHTML"
              hx-trigger="change"
              hx-include="[name='log_type'],[name='module'],[name='status'],[name='search']">
        <option value="24h">Letzte 24h</option>
        <option value="7d">7 Tage</option>
        <option value="30d" selected>30 Tage</option>
        <option value="">Alle</option>
      </select>

      <input type="text" name="search"
             placeholder="Suchen…"
             style="font-size:12px; padding:4px 8px;"
             hx-get="/api/activity_log/rows"
             hx-target="#activity-log-rows"
             hx-swap="innerHTML"
             hx-trigger="keyup changed delay:400ms"
             hx-include="[name='log_type'],[name='module'],[name='status'],[name='date_range']">
    </div>
  </div>

  <div class="ds-card on" style="overflow:hidden;">
    <div style="overflow-x:auto;">
      <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
        <thead>
          <tr>
            {% for col in ['Zeitpunkt', 'Typ', 'Modul', 'Beschreibung', 'Status', 'Dauer', 'Bytes', ''] %}
            <th style="padding:9px 14px; text-align:left; font-size:11px;
                       text-transform:uppercase; letter-spacing:0.05em;
                       color:var(--text-3); font-weight:600; white-space:nowrap;
                       border-bottom:1px solid var(--border-s);">{{ col }}</th>
            {% endfor %}
          </tr>
        </thead>
        <tbody id="activity-log-rows">
          {% include "activity_log/partials/rows.html" %}
        </tbody>
      </table>
    </div>
  </div>
</div>
