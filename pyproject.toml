[project]
name = "astrapi-backup"
dynamic = ["version"]
description = "Backup Control – Web-UI für Borg, Rsync, Proxmox"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.3",
    "uvicorn[standard]==0.43.0",
    "jinja2==3.1.6",
    "APScheduler==3.11.2",
    "pyyaml==6.0.3",
    "python-multipart==0.0.24",
    "cryptography==46.0.6",
    "requests==2.33.1",
    "urllib3==2.6.3",
    "psutil==7.2.2",
    "apispec==6.10.0",
    "astrapi-core>=26.8.10",
    "borgbackup==1.4.4",
]

[project.scripts]
astrapi-backup = "astrapi_backup._cli:main"

[build-system]
requires = ["setuptools>=61", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
include = ["astrapi_backup*"]

[tool.setuptools.package-data]
astrapi_backup = [
    "app.yaml",
    "navigation.yaml",
    "modules/*/templates/**/*.html",
    "modules/*/schema.yaml",
    "modules/*/modul.yaml",
    "modules/*/settings.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]   # pycodestyle, pyflakes, isort, warnings
ignore = ["E501"]                # Zeilenlänge wird vom Formatter gesteuert

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
