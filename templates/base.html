<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a3a3a3' stroke-width='1.8'><path d='M3 10.4C3 7.2 3 5.6 3.38 5.08C3.76 4.54 5.26 4.03 8.26 3L8.84 2.8C10.4 2.27 11.19 2 12 2s1.6.27 3.16.8l.57.2C18.74 4.03 20.24 4.54 20.62 5.08C21 5.62 21 7.22 21 10.42v1.57C21 17.63 16.76 20.37 14.1 21.53 13.38 21.84 13.02 22 12 22s-1.38-.16-2.1-.47C7.24 20.37 3 17.63 3 11.99V10.4z'/><polyline points='9 12 11 14 15 10'/></svg>">
  <title>{% block title %}backupctl{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-components.css') }}">
</head>
<body>

{% block content %}{% endblock %}

<div id="modal-container"></div>
<script src="https://unpkg.com/htmx.org@1.9.10/dist/htmx.min.js"></script>
<script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
<script src="{{ url_for('static', filename='js/components/navigation.js') }}"></script>
<script>
  function toggleDarkMode() {
    document.documentElement.classList.toggle('light-mode');
    localStorage.setItem('lightMode', document.documentElement.classList.contains('light-mode') ? '1' : '0');
  }
  if (localStorage.getItem('lightMode') === '1') document.documentElement.classList.add('light-mode');
</script>
</body>
</html>
