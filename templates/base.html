<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Borgitory - A comprehensive web-based management interface for BorgBackup repositories with real-time monitoring, automated scheduling, and cloud synchronization capabilities.">
  <meta name="keywords" content="borgbackup, backup, web-interface, scheduling, cloud-sync, archive-management, data-protection">
  <title>{% block title %} backupctl - Backup Control {% endblock title %}</title>

  <!-- Favicon 
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='favicon/apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon/favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon/favicon-16x16.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}">
  <link rel="manifest" href="{{ url_for('static', filename='favicon/site.webmanifest') }}">-->

  <!-- HTMX + extensions -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/sse.js"></script>
  <script src="https://unpkg.com/htmx.org/dist/ext/json-enc.js"></script>

  <!-- Tailwind (configures dark mode via class) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Borgitory component CSS (modern-components) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-components.css') }}">
</head>
<body class="bg-gray-50 dark:bg-gray-900 min-h-screen">

  <nav class="bg-white dark:bg-gray-800 shadow-sm border-b dark:border-gray-700">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between h-16">
        <div class="flex items-center">
          <!-- Hamburger Menu Button (Mobile Only) -->
          <button id="mobile-menu-button"
                  hx-on:click=" document.getElementById('sidebar').classList.toggle('mobile-open'); document.getElementById('sidebar-overlay').classList.toggle('hidden'); document.getElementById('sidebar-overlay').classList.toggle('show'); document.getElementById('hamburger-icon').classList.toggle('hidden'); document.getElementById('close-icon').classList.toggle('hidden'); document.body.classList.toggle('mobile-sidebar-open'); this.setAttribute('aria-expanded', this.getAttribute('aria-expanded') === 'true' ? 'false' : 'true'); "
                  class="lg:hidden mr-3 p-2 rounded-md text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-gray-100 hover:bg-gray-100 dark:hover:bg-gray-700 focus:outline-none focus:ring-2 focus:ring-inset focus:ring-blue-500"
                  aria-expanded="false" aria-controls="mobile-sidebar">
            <span class="sr-only">Open sidebar</span>
            <!-- Hamburger Icon -->
            <svg id="hamburger-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
            <!-- Close Icon (hidden by default) -->
            <svg id="close-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>

          <div class="flex items-center">
            <!-- <img src="{{ url_for('static', filename='favicon/favicon-32x32.png') }}" alt="Borgitory Logo" class="w-8 h-8 mr-3" width="32" height="32"> -->
            <h1 class="text-xl font-semibold text-gray-900 dark:text-gray-100">Backup Control</h1>
          </div>
        </div>

        <div class="flex items-center space-x-4">
          {% if current_user %}
            <span class="text-sm text-gray-700 dark:text-gray-300"> Welcome, <span class="font-medium">{{ current_user.username }}</span> </span>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1 rounded text-sm transition-colors"> Logout </button>
          {% endif %}
        </div>

            <!-- Dark Mode Toggle -->
            <button onclick="toggleDarkMode()"
                    id="dark-mode-toggle"
                    class="p-2 rounded-lg bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors"
                    title="Toggle dark mode">
                <!-- Sun icon (shown in dark mode) -->
                <svg id="sun-icon"
                     class="w-5 h-5 text-yellow-500 hidden dark:block"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z">
                    </path>
                </svg>
                <!-- Moon icon (shown in light mode) -->
                <svg id="moon-icon"
                     class="w-5 h-5 text-gray-600 dark:text-gray-400 block dark:hidden"
                     fill="none"
                     stroke="currentColor"
                     viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z">
                    </path>
                </svg>
            </button>

      </div>
    </div>
  </nav>

  <main>
    {% block content %} {% endblock content %}
  </main>

  <!-- <div id="notification-area" class="fixed top-4 right-4 z-50"></div> -->

  <!-- Timezone Detection Script -->
  <script>
    function getBrowserTimezoneOffset() { return new Date().getTimezoneOffset(); }
    function setCookie(name, value, days = 30) {
      const expires = new Date();
      expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = `${name}=${value};expires=${expires.toUTCString()};path=/;SameSite=Lax`;
    }
    function setupTimezoneCookie() {
      const timezoneOffset = getBrowserTimezoneOffset();
      setCookie('browser_timezone_offset', timezoneOffset.toString());
    }
    document.addEventListener('DOMContentLoaded', setupTimezoneCookie);
  </script>

  <!-- Component JavaScript Files (Borgitory) -->
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  <script src="{{ url_for('static', filename='js/components/navigation.js') }}"></script>
  <!-- <script src="{{ url_for('static', filename='js/components/jobs.js') }}"></script> -->

  <script>

    // Logout function
    async function logout() {
      try {
        const response = await fetch('/auth/logout', { method: 'POST', credentials: 'include' });
        if (response.ok) {
          showHTMXNotification('Logged out successfully', 'success');
          setTimeout(() => { window.location.href = '/login'; }, 1000);
        } else {
          showHTMXNotification('Logout failed', 'error');
        }
      } catch (error) {
        console.error('Logout error:', error);
        showHTMXNotification('Logout failed', 'error');
      }
    }

    // Global HTMX event listeners
    document.body.addEventListener('htmx:responseError', function(evt) {
      if (!evt.target.hasAttribute('hx-on::after-request')) {
        showHTMXNotification('An error occurred: ' + evt.detail.xhr.statusText, 'error');
      }
    });

    // Close sidebar when clicking outside on mobile
    document.addEventListener('click', function(event) {
      const sidebar = document.getElementById('sidebar');
      const button = document.getElementById('mobile-menu-button');
      const isClickInsideSidebar = sidebar && sidebar.contains(event.target);
      const isClickOnButton = button && button.contains(event.target);
      const isMobile = window.innerWidth < 1024;
      if (isMobile && !isClickInsideSidebar && !isClickOnButton && sidebar && sidebar.classList.contains('mobile-open')) {
        htmxCloseMobileSidebar();
      }
    });

    // Close sidebar on window resize to desktop
    window.addEventListener('resize', function() {
      const sidebar = document.getElementById('sidebar');
      if (window.innerWidth >= 1024 && sidebar && sidebar.classList.contains('mobile-open')) {
        htmxCloseMobileSidebar();
      }
    });

    // Handle escape key to close sidebar
    document.addEventListener('keydown', function(event) {
      const sidebar = document.getElementById('sidebar');
      if (event.key === 'Escape' && sidebar && sidebar.classList.contains('mobile-open')) {
        htmxCloseMobileSidebar();
      }
    });

    // Global click handler to close autocomplete dropdowns
    document.addEventListener('click', function(event) {
      const clickedAutocomplete = event.target.closest('[data-path-autocomplete]');
      if (!clickedAutocomplete) {
        const autocompleteDropdowns = document.querySelectorAll('[data-path-autocomplete] [id$="dropdown"]');
        autocompleteDropdowns.forEach(dropdown => { dropdown.style.display = 'none'; });
      }
    });
  </script>


</body>
</html>
