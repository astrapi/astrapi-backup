{% import 'partials/components/ui_macros.html' as ui %}

<div id="{{ container_id }}" class="tab-content">
  <div class="page-header">
    <div class="page-title">{{ title }}</div>
    <button
      class="btn btn-primary"
      hx-get="/ui/{{ module }}/create?container_id={{ container_id }}&loading_id={{ loading_id }}"
      hx-target="body"
      hx-swap="beforeend"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Neu
    </button>
  </div>

  <div id="{{ container_id }}-list" class="ds-list-grid">
    {% include list_wrapper %}
  </div>

  <div id="{{ loading_id }}" class="htmx-indicator"></div>
</div>
