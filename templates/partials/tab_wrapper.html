{% import 'partials/components/ui_macros.html' as ui %}

<div id="{{ container_id }}" class="tab-content">
  <div class="page-header">
    <div class="page-title">{{ title }}</div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button
        class="btn btn-success btn-sm"
        hx-post="/api/run/{{ module }}?debug=false"
        hx-target="#{{ container_id }}-list"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
        title="Alle aktivierten Einträge ausführen"
      >
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Run
      </button>
      <button
        class="btn btn-ghost btn-sm"
        hx-post="/api/run/{{ module }}?debug=true"
        hx-target="#{{ container_id }}-list"
        hx-swap="innerHTML"
        hx-headers='{"HX-Request": "true"}'
        title="Alle Einträge im Debug-Modus"
      >
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Run (Debug)
      </button>
      <button
        class="btn btn-primary"
        hx-get="/ui/{{ module }}/create?container_id={{ container_id }}&loading_id={{ loading_id }}"
        hx-target="body"
        hx-swap="beforeend"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Neu
      </button>
    </div>
  </div>

  <div id="{{ container_id }}-list" class="ds-list-grid">
    {% include list_wrapper %}
  </div>

  <div id="{{ loading_id }}" class="htmx-indicator"></div>
</div>
