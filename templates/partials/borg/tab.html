{% import 'partials/components/ui_macros.html' as ui %}
<div id="tab-borg" class="tab-content">
  <div class="bg-white dark:bg-gray-800 rounded-lg shadow p-6">
    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-gray-100">Borg</h1>
      </div>
      <div class="flex items-center space-x-3">
        {{ ui.refresh_button(endpoint='/api/tabs/borg', target='#borg-info-container', indicator='#borg-loading', btn_id='refresh-borg-btn', label='Refresh') }}
      </div>
    </div>

    <!-- Container where the list partial is loaded -->
    <div id="borg-info-container" class="space-y-4">
      {% include 'partials/borg/tab_list.html' %}
    </div>

    <!-- optional loading indicator -->
    <div id="borg-loading" class="hidden">Loading…</div>
  </div>
</div>
