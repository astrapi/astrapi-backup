<div class="flex flex-col gap-1">

  <label class="text-gray-700 dark:text-gray-300 text-sm font-medium">
    {{ field.label }}
    {% if field.required %}
      <span class="text-red-500 ml-0.5">*</span>
    {% endif %}
  </label>

  {% if field.type == "text" %}
    <input
      type="text"
      name="{{ field.name }}"
      value="{{ values[field.name] if values else '' }}"
      {% if field.max %}maxlength="{{ field.max }}"{% endif %}
      {% if field.min_length %}minlength="{{ field.min_length }}"{% endif %}
      {% if field.pattern %}pattern="{{ field.pattern }}"{% endif %}
      {% if field.required %}data-required="true"{% endif %}
      class="px-3 py-2 rounded bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100 border border-transparent focus:outline-none focus:ring-2 focus:ring-purple-500"
      {% if field.placeholder %}placeholder="{{ field.placeholder }}"{% endif %}
    >
    <span class="validation-error text-red-500 text-xs hidden"></span>

  {% elif field.type == "boolean" %}
    <input
      type="checkbox"
      name="{{ field.name }}"
      {% if values and values[field.name] %}checked{% endif %}
      class="w-4 h-4"
    >

  {% elif field.type == "number" %}
    <input
      type="number"
      name="{{ field.name }}"
      value="{{ values[field.name] if values else '' }}"
      {% if field.min is defined %}min="{{ field.min }}"{% endif %}
      {% if field.max is defined and field.type == "number" %}max="{{ field.max }}"{% endif %}
      {% if field.required %}data-required="true"{% endif %}
      class="px-3 py-2 rounded bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100 border border-transparent focus:outline-none focus:ring-2 focus:ring-purple-500"
    >
    <span class="validation-error text-red-500 text-xs hidden"></span>

  {% elif field.type == "select" %}
    <select
      name="{{ field.name }}"
      {% if field.required %}data-required="true"{% endif %}
      class="px-3 py-2 rounded bg-gray-100 dark:bg-gray-700 text-gray-900 dark:text-gray-100 border border-transparent focus:outline-none focus:ring-2 focus:ring-purple-500"
    >
      {% if not field.required %}
        <option value="">– bitte wählen –</option>
      {% endif %}
      {% for opt in field.options %}
        <option value="{{ opt }}"
          {% if values and values[field.name] == opt %}selected{% endif %}
        >
          {{ opt }}
        </option>
      {% endfor %}
    </select>
    <span class="validation-error text-red-500 text-xs hidden"></span>

  {% elif field.type == "list" %}
    {% include "partials/create_edit/list_field.html" %}
  {% endif %}

</div>
