<div
  id="confirm-modal"
  class="ds-modal-backdrop"
>
  <div class="confirm-dialog">
<div style="text-align:center; margin-bottom:22px;">
      <div style="font-size:15px; font-weight:600; color:var(--text); margin-bottom:6px;">
        Bestätigung erforderlich
      </div>
      <div style="font-size:13px; color:var(--text-2);">
        <strong style="color:var(--text);">{{ description }}</strong> wirklich {{ verb }}?
      </div>
    </div>

    <div style="border-top:1px solid var(--border-s); padding-top:10px; margin-top:4px;">
    <div style="display:flex; gap:8px; justify-content:center;">
      <button
        class="btn btn-ghost"
        onclick="document.getElementById('confirm-modal').remove()"
      >
        Abbrechen
      </button>

      {% if method == "delete" %}
      <form
        hx-delete="{{ confirm_url }}?container_id={{ container_id }}&loading_id={{ loading_id }}"
        hx-target="#{{ container_id }}-list"
        hx-swap="innerHTML"
        hx-indicator="#{{ loading_id }}"
        hx-headers='{"HX-Request": "true"}'
        hx-on::after-request="document.getElementById('confirm-modal').remove()"
        style="display:inline;"
      >
        <button type="submit" class="btn btn-danger">
          Ja, {{ verb }}
        </button>
      </form>
      {% else %}
      <form
        hx-post="{{ confirm_url }}?container_id={{ container_id }}&loading_id={{ loading_id }}"
        hx-target="#{{ container_id }}-list"
        hx-swap="innerHTML"
        hx-indicator="#{{ loading_id }}"
        hx-headers='{"HX-Request": "true"}'
        hx-on::after-request="document.getElementById('confirm-modal').remove()"
        style="display:inline;"
      >
        <button type="submit" class="btn btn-danger">
          Ja, {{ verb }}
        </button>
      </form>
      {% endif %}
    </div>
    </div>
  </div>
</div>
