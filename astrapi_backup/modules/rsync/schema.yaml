modal_width: 860
id_field: id

fields:
  - name: description
    type: text
    label: Name
    max: 50
    required: true

  - name: enabled
    type: boolean
    label: Aktiviert

  - type: section
    label: Quelle / Ziel
    cols: 1

  - name: source_remote_id
    type: select
    label: Source Server
    options_endpoint: /api/remotes/for-select?type=rsync
    required: true

  - name: source_path
    type: text
    label: Source Path
    max: 200

  # - type: section
  #   label: Ziel
  #   cols: 2

  - name: target_remote_id
    type: select
    label: Target Server
    options_endpoint: /api/remotes/for-select?type=rsync
    required: false

  - name: target_path
    type: text
    label: Target Path
    max: 200
