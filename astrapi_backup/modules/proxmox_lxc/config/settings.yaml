modal_width: 720

fields:
  - type: section
    label: vzdump
    cols: 2

  - key: backup_storage
    label: Storage
    type: text
    placeholder: "backup01"
    default: "backup01"
    description: Name des Proxmox-Storages für die Backups (--storage)

  - key: backup_mode
    label: Backup-Modus
    type: select
    options:
      - value: snapshot
        label: Snapshot (empfohlen)
      - value: stop
        label: Stop
      - value: suspend
        label: Suspend
    default: snapshot
    description: vzdump Backup-Modus (--mode)

  - key: notes_template
    label: Notes-Template
    type: text
    placeholder: "{{guestname}}"
    default: "{{guestname}}"
    description: Template für die Backup-Notiz in Proxmox (--notes-template)

  - type: section
    label: Ausführung
    cols: 2

  - key: max_parallel
    label: Gleichzeitige Sicherungen
    type: number
    min: 1
    max: 16
    default: 2
    description: >
      Wie viele LXC-Sicherungen der Scheduler gleichzeitig anstößt. Ohne
      Begrenzung startete Python so viele wie CPU-Kerne plus vier — auf einem
      Vierkerner also acht auf einmal.


