modal_width: 720

fields:
  - type: section
    label: vzdump
    cols: 2

  - key: backup_storage
    label: Storage
    type: text
    placeholder: "backup01"
    default: "backup01"
    description: Name des Proxmox-Storages für die Backups (--storage)

  - key: backup_mode
    label: Backup-Modus
    type: select
    options:
      - value: snapshot
        label: Snapshot (empfohlen)
      - value: stop
        label: Stop
      - value: suspend
        label: Suspend
    default: snapshot
    description: vzdump Backup-Modus (--mode)

  - key: notes_template
    label: Notes-Template
    type: text
    placeholder: "{{guestname}}"
    default: "{{guestname}}"
    description: Template für die Backup-Notiz in Proxmox (--notes-template)

  - type: section
    label: Ausführung
    cols: 2

  - key: max_parallel
    label: Gleichzeitige Sicherungen je Node
    type: number
    min: 1
    max: 16
    default: 2
    description: >
      Wie viele LXC-Sicherungen gleichzeitig auf demselben Proxmox-Node laufen.
      Verschiedene Nodes arbeiten unabhängig voneinander: bei 2 und drei Nodes
      laufen also bis zu sechs gleichzeitig, zwei je Node.

  - type: section
    label: astrapi-admin
    cols: 1

  - key: astrapi_admin_url
    label: astrapi-admin-URL
    type: text
    placeholder: "http://admin.simpsons.lan:5005"
    description: >
      Optional (E-010). Verhindert, dass ein Backup startet, während
      astrapi-admin gerade ein Update auf demselben LXC laufen hat --
      fragt vor jedem vzdump-Aufruf den (aktuell unauthentifizierten)
      Endpunkt GET /api/agent/proxmox-pending-updates ab. Leer lassen
      zum Deaktivieren; ein nicht erreichbares/falsch konfiguriertes
      astrapi-admin blockiert das Backup dabei nie (fail-open).

