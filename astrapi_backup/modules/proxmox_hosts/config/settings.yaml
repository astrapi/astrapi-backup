modal_width: 720

fields:
  - type: section
    label: PBS
    cols: 1

  - key: pbs_remote_id
    label: PBS Server
    type: select
    options_endpoint: /api/remotes/for-select?type=proxmox_backup&local=0
    description: "Remote-Gerät mit Typ 'Proxmox Backup' als PBS-Server verwenden"
    default: ""

  - type: section
    label: Backup-Quellen
    cols: 1

  - key: default_sources
    label: Standard-Backup-Quellen
    type: list
    description: "Quellen die für jeden Host gesichert werden (Format: name.pxar:/pfad)."
    mono: true
    default:
      - "etc.pxar:/etc"
      - "home.pxar:/home"
      - "opt.pxar:/opt"
      - "root.pxar:/root"
      - "local.pxar:/usr/local"
