<div>
{% if available %}
<select class="form-select" onchange="
  var opt = this.options[this.selectedIndex];
  document.getElementById('pjobs-job').value         = opt.dataset.job       || '';
  document.getElementById('pjobs-type').value        = opt.dataset.jobType   || '';
  document.getElementById('pjobs-remote-id').value   = opt.dataset.remoteId  || '';
  document.getElementById('pjobs-description').value = opt.dataset.job       || '';
">
  <option value="">— Job wählen —</option>
  {% for j in available %}
  <option value="{{ j.job }}"
          data-job="{{ j.job }}"
          data-job-type="{{ j.type }}"
          data-remote-id="{{ j.remote_id }}">
    [{{ j.type }}] {{ j.job }}{% if j.store %} ({{ j.store }}){% endif %} — {{ j.host }}{% if j.schedule %}, {{ j.schedule }}{% endif %}
  </option>
  {% endfor %}
</select>
{% else %}
<p style="color:var(--text-3); font-size:13px; margin:0; padding:4px 0;">
  Alle Jobs bereits registriert, kein API-Token konfiguriert oder keine PBS-Hosts erreichbar.
</p>
{% endif %}
</div>
