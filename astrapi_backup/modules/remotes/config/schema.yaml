modal_width: 800
id_field: id

fields:
  - name: host
    type: text
    label: Hostname / IP
    placeholder: "server.lan"
    max: 100
    column: 1
    row: 1

  - name: enabled
    type: boolean
    label: Aktiviert
    column: 2
    row: 1

  - name: mac
    type: text
    label: MAC-Adresse (Wake-on-LAN)
    placeholder: "aa:bb:cc:dd:ee:ff"
    max: 17
    column: 1
    row: 2

  - name: poweroff_cmd
    type: select
    label: Shutdown-Befehl
    column: 2
    row: 2
    default: "sudo shutdown -h now"
    options:
      - value: "sudo shutdown -h now"
        label: "sudo shutdown -h now"
      - value: "sudo systemctl poweroff"
        label: "sudo systemctl poweroff"

  - type: section
    label: SSH-Authentifizierung (Backups)
    cols: 2

  - name: ssh_user
    type: text
    label: SSH-Benutzer
    placeholder: "backupadm"
    max: 50
    default: backupadm
    column: 1
    row: 3

  - name: ssh_port
    type: number
    label: SSH-Port
    default: 22
    column: 2
    row: 3

  - name: ssh_connect_timeout
    type: number
    label: SSH ConnectTimeout (s)
    hint: "0 = global (10 s)"
    default: 0
    column: 1
    row: 4

  - type: section
    label: Verwendung
    cols: 1

  - name: types
    type: multiselect
    label: Typen
    options:
      - value: borg_source
        label: Borg Source
      - value: borg_target
        label: Borg Target
      - value: rsync
        label: Rsync
      - value: proxmox_node
        label: Proxmox Node
      - value: proxmox_client
        label: Proxmox Client
      - value: proxmox_backup
        label: Proxmox Backup

  - type: section
    label: API-Token (Proxmox)
    cols: 2

  - name: api_token_id
    type: text
    label: Token-ID
    placeholder: "root@pam!ctl-read"
    max: 100
    column: 1

  - name: api_verify_ssl
    type: boolean
    label: SSL verifizieren
    column: 2

  - name: api_token_secret
    type: password
    label: Token-Secret
    span: 2

  - type: section
    label: PBS (Proxmox Backup Server)
    cols: 2

  - name: pbs_datastore
    type: text
    label: Datastore
    placeholder: "datastore-name"
    max: 100
    column: 1

  - name: pbs_fingerprint
    type: text
    label: Fingerprint
    placeholder: "AB:CD:EF:..."
    max: 200
    mono: true
    column: 2

  - type: section
    label: Borg
    cols: 1

  - name: borg_bin
    type: text
    label: Borg-Pfad
    placeholder: "/var/lib/backupadm/.venv/bin/borg"
    max: 200
