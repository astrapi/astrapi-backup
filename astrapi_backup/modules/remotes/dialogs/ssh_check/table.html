<div class="content-items content-items--table">
    <table class="ds-list-table">
      <thead>
        <tr>
          <th style="width:200px;">Host</th>
          <th style="width:140px;">Benutzer</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% if not results %}
        <tr class="on">
          <td colspan="3" style="text-align:center; color:var(--text-3);">
            Keine aktivierten Geräte gefunden.
          </td>
        </tr>
        {% endif %}
        {% for r in results %}
        <tr class="on">
          <td style="font-family:var(--mono); font-size:12px;">{{ r.host }}</td>
          <td style="font-family:var(--mono); font-size:12px; color:var(--text-3);">{{ r.user }}</td>
          <td>
            {% if r.ok %}
              <span style="color:#4ade80; font-size:12px;">✓ erreichbar</span>
            {% elif r.error %}
              <span style="color:var(--r); font-size:12px;" title="{{ r.error }}">✗ {{ r.error }}</span>
            {% else %}
              <span style="color:var(--r); font-size:12px;">✗ nicht erreichbar</span>
            {% endif %}
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
</div>
