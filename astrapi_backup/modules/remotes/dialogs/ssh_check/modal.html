{% extends "dialog_core.html" %}

{% block dialog_width %}900{% endblock %}
{% block dialog_title %}SSH-Erreichbarkeit{% endblock %}

{% block dialog_body %}
<div id="ssh-check-body">
  {% include "remotes/dialogs/ssh_check/spinner.html" %}
</div>
{% endblock %}

{% block dialog_footer %}
<div class="ds-modal-footer">
  <svg class="htmx-indicator" width="14" height="14" viewBox="0 0 24 24"
       fill="currentColor" stroke="none"
       style="animation:spin 1s linear infinite; color:var(--text-3);"><use href="#icon-loading"></use></svg>
  <div style="display:flex; gap:8px;">
    <button type="button" class="btn btn-sm btn-ghost"
            onclick="closeModal(this)">Schließen</button>
    <button type="button" class="btn btn-sm btn-secondary"
            hx-get="/ui/remotes/check-ssh-spinner"
            hx-target="#ssh-check-body"
            hx-swap="innerHTML">Erneut prüfen</button>
  </div>
</div>
{% endblock %}
