{# templates/partials/scheduler/tab.html #}
<div id="tab-scheduler" class="tab-content">
  <div class="page-header">
    <div class="page-title">Scheduler</div>
    <button class="btn btn-primary btn-sm"
      hx-get="/ui/scheduler/create" hx-target="body" hx-swap="beforeend">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Neuer Job
    </button>
  </div>
  <div id="tab-scheduler-list" class="ds-list-grid">
    {% include "partials/scheduler/job_list.html" %}
  </div>
  <div id="scheduler-loading" class="htmx-indicator"></div>
</div>
