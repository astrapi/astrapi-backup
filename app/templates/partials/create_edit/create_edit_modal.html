<div
  id="create-edit-modal"
  class="ds-modal-backdrop"
>
  <div class="ds-modal" style="max-width:620px; padding:20px 24px;">
{% if item %}
    <form id="create-edit-form"
      hx-patch="{{ submit_url }}"
      hx-target="#{{ container_id }}-list"
      hx-swap="innerHTML"
      hx-indicator="#{{ loading_id }}"
      hx-headers='{"HX-Request": "true"}'
      style="display:flex; flex-direction:column; gap:14px;"
    >
    {% else %}
    <form id="create-edit-form"
      hx-post="{{ submit_url }}"
      hx-target="#{{ container_id }}-list"
      hx-swap="innerHTML"
      hx-indicator="#{{ loading_id }}"
      hx-headers='{"HX-Request": "true"}'
      style="display:flex; flex-direction:column; gap:14px;"
    >
    {% endif %}

      {% set rows = schema | groupby("row") %}
      {% for row, fields in rows %}
        <div style="display:grid; grid-template-columns:{% if fields|length == 2 and fields[1].type == 'boolean' %}1fr auto{% else %}repeat({{ fields|length }}, 1fr){% endif %}; gap:12px; align-items:{% if fields|length == 2 and fields[1].type == 'boolean' %}end{% else %}start{% endif %};">
          {% for field in fields %}
            {% include "partials/create_edit/field_renderer.html" %}
          {% endfor %}
        </div>
      {% endfor %}

      <!-- Footer -->
      <div style="display:flex; justify-content:center; gap:8px; padding-top:10px; border-top:1px solid var(--border-s); margin-top:2px;">
        <button
          type="button"
          onclick="document.getElementById('create-edit-modal').remove()"
          class="btn btn-ghost"
        >
          Abbrechen
        </button>
        <button
          type="button"
          id="create-edit-submit"
          class="btn btn-primary"
        >Speichern
        </button>
      </div>
    </form>
  </div>
</div>

<script>
(function () {
  const form = document.getElementById('create-edit-form');
  const submitBtn = document.getElementById('create-edit-submit');

  function validateField(input) {
    const errorEl = input.parentElement.querySelector('.form-error');
    let message = '';
    const isRequired = input.dataset.required === 'true';
    const value = input.value.trim();

    if (isRequired && value === '') {
      message = 'Dieses Feld ist erforderlich.';
    } else if (input.type === 'number' && value !== '') {
      const num = Number(value);
      if (isNaN(num)) {
        message = 'Bitte eine gültige Zahl eingeben.';
      } else if (input.min !== '' && num < Number(input.min)) {
        message = `Mindestwert ist ${input.min}.`;
      } else if (input.max !== '' && num > Number(input.max)) {
        message = `Maximalwert ist ${input.max}.`;
      }
    } else if (input.minLength > 0 && value.length < input.minLength) {
      message = `Mindestens ${input.minLength} Zeichen erforderlich.`;
    }

    if (errorEl) {
      errorEl.textContent = message;
      errorEl.classList.toggle('visible', message !== '');
    }
    input.classList.toggle('is-invalid', message !== '');
    return message === '';
  }

  form.querySelectorAll('input[data-required], input[type="number"], select[data-required]')
    .forEach(input => {
      input.addEventListener('blur', () => validateField(input));
      input.addEventListener('input', () => { if (input.classList.contains('is-invalid')) validateField(input); });
    });

  submitBtn.addEventListener('click', function () {
    const inputs = form.querySelectorAll('input[data-required], input[type="number"], select[data-required]');
    let valid = true;
    inputs.forEach(input => { if (!validateField(input)) valid = false; });

    if (!valid) {
      const firstError = form.querySelector('.form-error.visible');
      if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }

    htmx.trigger(form, 'submit');
    form.addEventListener('htmx:afterRequest', function handler(e) {
      if (e.detail.successful) {
        document.getElementById('create-edit-modal')?.remove();
      }
      form.removeEventListener('htmx:afterRequest', handler);
    });
  });
})();
</script>
