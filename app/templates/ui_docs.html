<!DOCTYPE html>
<html>
<head>
    <title>UI Documentation</title>
    <link rel="stylesheet" href="/static/swagger/swagger-ui.css">
    
    <style>
    /* Topbar komplett entfernen */
    .topbar {
        display: none !important;
    }

    /* Optional: Abstand oben reduzieren */
    .swagger-ui {
        margin-top: 0 !important;
    }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>

    <script src="/static/swagger/swagger-ui-bundle.js"></script>
    <script src="/static/swagger/swagger-ui-standalone-preset.js"></script>

    <script>
        window.onload = function() {
            SwaggerUIBundle({
                url: "/ui/openapi.json",
                dom_id: "#swagger-ui",
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: "StandaloneLayout"
            });
        };
    </script>
</body>
</html>
