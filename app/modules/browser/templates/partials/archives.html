{# Archive-Liste für ein Repo #}
<div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
  <button class="btn btn-ghost btn-sm"
          hx-get="/api/browser/tab"
              hx-indicator="#browser-loading"
          hx-target="#main-content"
          hx-swap="innerHTML">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
    Zurück
  </button>
  <span style="font-size:14px; font-weight:600;">{{ repo.name }}</span>
  <span style="font-size:12px; color:var(--text-3); font-family:var(--mono);">{{ repo.path }}</span>
</div>

{% if error %}
<div class="ds-card on" style="padding:16px; color:var(--err); font-size:13px;">
  Fehler: {{ error }}
</div>
{% elif not archives %}
<div class="ds-card on" style="padding:24px; text-align:center; color:var(--text-3);">
  Keine Archive gefunden.
</div>
{% else %}
<div class="ds-card on">
  <div class="card-header">
    <div class="card-title">Archive ({{ archives|length }})</div>
  </div>
  <div style="display:flex; flex-direction:column;">
    {% for a in archives %}
    <button
      style="display:flex; align-items:center; justify-content:space-between;
             padding:10px 14px; border:none; background:transparent;
             border-bottom:1px solid rgba(0,0,0,0.35); cursor:pointer;
             text-align:left; color:var(--text); transition:background 120ms;"
      onmouseover="this.style.background='rgba(255,255,255,0.05)'"
      onmouseout="this.style.background='transparent'"
      hx-get="/api/browser/{{ repo.id }}/{{ a.name }}/browse"
              hx-indicator="#browser-loading"
      hx-target="#main-content"
      hx-swap="innerHTML">
      <div style="display:flex; align-items:center; gap:10px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" style="color:var(--b); flex-shrink:0;">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
        </svg>
        <span style="font-family:var(--mono); font-size:12.5px;">{{ a.name }}</span>
      </div>
      <span style="font-size:11px; color:var(--text-3);">
        {{ a.time[:16].replace('T',' ') if a.time else '' }}
      </span>
    </button>
    {% endfor %}
  </div>
</div>
{% endif %}
