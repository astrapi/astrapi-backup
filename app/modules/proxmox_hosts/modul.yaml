# app/modules/proxmox_hosts/modul.yaml – Modul-Konfiguration

label:       Proxmox Hosts
icon:        server
nav_group:   Proxmox
nav_default: false

card_actions:
  - type: run
    url:  /api/proxmox_hosts/{item}/run
  - type: run_debug
    url:  /api/proxmox_hosts/{item}/run?debug=true
  - type: log
    url:  /api/proxmox_hosts/{item}/logs
  - title: Befehlsvorschau
    icon:  terminal-box
    style: log
    hx_get:    /api/proxmox_hosts/{item}/preview
    hx_target: body
    hx_swap:   beforeend
