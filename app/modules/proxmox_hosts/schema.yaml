    type: text
    label: Beschreibung
    max: 50
    column: 1
    row: 1
    required: true
  - name: enabled
    type: boolean
    label: Aktiviert
    column: 2
    row: 1
  - name: host
    type: text
    label: Host
    max: 50
    column: 1
    row: 2
  - name: namespace
    type: select
    label: PBS Namespace
    default: host
    column: 1
    row: 3

  - name: source
    type: list
    label: Zusätzliche Quellen
    column: 1
    row: 4
