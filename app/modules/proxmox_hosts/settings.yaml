- key: pbs_url
  label: PBS Server-URL
  type: text
  placeholder: "https://pbs.example.com:8007"
  description: URL des Proxmox Backup Servers
  default: ""

- key: pbs_user
  label: PBS Benutzer
  type: text
  placeholder: "backup@pbs"
  description: Benutzername für die PBS-Authentifizierung
  default: ""

- key: pbs_datastore
  label: Datastore
  type: text
  placeholder: "backups"
  description: Name des PBS-Datastores
  default: ""

- key: pbs_token_name
  label: API-Token Name
  type: text
  placeholder: "backup-token"
  description: Name des PBS API-Tokens (ohne Benutzerpräfix)
  default: ""

- key: pbs_password
  label: PBS Passwort / Token-Secret
  type: password
  placeholder: "••••••••"
  description: Passwort oder API-Token-Secret für die PBS-Authentifizierung
  default: ""

- key: pbs_fingerprint
  label: PBS Fingerprint
  type: text
  placeholder: "AB:CD:EF:..."
  description: TLS-Fingerprint des PBS-Servers
  mono: true
  default: ""
