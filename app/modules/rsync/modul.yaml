# app/modules/rsync/modul.yaml – Modul-Konfiguration

label:       Rsync
icon:        refresh-cw
nav_group:   Backup
nav_default: false

card_actions:
  - type: run
    url:  /api/rsync/{item}/run
  - type: run_debug
    url:  /api/rsync/{item}/run?debug=true
  - type: log
    url:  /api/rsync/{item}/logs
  - title: Befehlsvorschau
    icon:  terminal-box
    style: log
    hx_get:    /api/rsync/{item}/preview
    hx_target: body
    hx_swap:   beforeend
