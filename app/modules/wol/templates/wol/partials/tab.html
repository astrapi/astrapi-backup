{# wol/partials/tab.html #}
<div id="tab-wol" class="tab-content">

  <div class="page-header">
    <div class="page-title">Wake on LAN</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:28px; max-width:720px;">

    <section>
      <div class="ds-card on">
        <form hx-post="/api/wol/settings"
              hx-target="#wol-status" hx-swap="innerHTML">

          {# Spalten-Header #}
          <div style="display:grid; grid-template-columns:1fr 1fr 36px;
                      gap:8px; padding:8px 14px 4px;
                      font-size:11px; font-weight:600; color:var(--text-3);
                      text-transform:uppercase; letter-spacing:0.06em;
                      border-bottom:1px solid rgba(0,0,0,0.35);">
            <span>MAC-Adresse</span>
            <span>Hostname</span>
            <span></span>
          </div>

          <div id="wol-rows" style="display:flex; flex-direction:column;">
            {% for e in wol_entries %}
            <div class="wol-row"
                 style="display:grid; grid-template-columns:1fr 1fr 36px;
                        gap:8px; padding:8px 14px; align-items:center;
                        border-bottom:1px solid rgba(0,0,0,0.25);">
              <input type="text" name="wol_mac" class="form-input"
                     style="font-family:var(--mono); font-size:13px;"
                     placeholder="aa:bb:cc:dd:ee:ff" value="{{ e.mac }}">
              <input type="text" name="wol_host" class="form-input"
                     placeholder="server.lan" value="{{ e.host }}">
              <button type="button" class="btn-icon btn-icon-danger"
                      onclick="wolRemove(this)" title="Entfernen"
                      style="flex-shrink:0;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <polyline points="3 6 5 6 21 6"/>
                  <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                  <path d="M10 11v6m4-6v6"/><path d="M9 6V4h6v2"/>
                </svg>
              </button>
            </div>
            {% endfor %}
          </div>

          <div class="settings-row-actions" style="justify-content:space-between;">
            <button type="button" onclick="wolAdd()" class="btn btn-ghost btn-sm">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Gerät hinzufügen
            </button>
            <div style="display:flex; gap:8px; align-items:center;">
              <button type="submit" class="btn btn-primary btn-sm">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
                Speichern
              </button>
              <span id="wol-status" class="settings-status"></span>
            </div>
          </div>
        </form>
      </div>
    </section>

  </div>
</div>

<script>
(function() {
  var WOL_ROW =
    '<div class="wol-row" style="display:grid;grid-template-columns:1fr 1fr 36px;' +
    'gap:8px;padding:8px 14px;align-items:center;border-bottom:1px solid rgba(0,0,0,0.25);">' +
    '<input type="text" name="wol_mac" class="form-input"' +
    ' style="font-family:var(--mono);font-size:13px;" placeholder="aa:bb:cc:dd:ee:ff">' +
    '<input type="text" name="wol_host" class="form-input" placeholder="server.lan">' +
    '<button type="button" class="btn-icon btn-icon-danger" onclick="wolRemove(this)" title="Entfernen">' +
    '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
    '<polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>' +
    '<path d="M10 11v6m4-6v6"/><path d="M9 6V4h6v2"/></svg></button></div>';

  window.wolAdd    = function() { document.getElementById('wol-rows').insertAdjacentHTML('beforeend', WOL_ROW); };
  window.wolRemove = function(btn) { var r=document.querySelectorAll('.wol-row'); if(r.length>1) btn.closest('.wol-row').remove(); };
})();
</script>
