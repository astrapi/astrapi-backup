# app/modules/repos/schema.yaml – Felder für das Bearbeiten-Modal
id_field:
  name:  id
  label: ID

fields:
  - name:        name
    type:        text
    label:       Name
    placeholder: "z.B. home-backup"
    max:         100
    required:    true
    column:      1
    row:         1

  - name:        path
    type:        text
    label:       Pfad
    placeholder: "/mnt/borg/repo"
    max:         500
    required:    true
    mono:        true
    column:      2
    row:         1

  - name:        description
    type:        text
    label:       Beschreibung
    placeholder: "Optionale Beschreibung"
    max:         200
    column:      1
    row:         2
