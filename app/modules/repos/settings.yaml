# Repositories-Modul – globale Einstellungen

- key: base_path
  label: Standard-Pfad
  type: text
  placeholder: /mnt/borg
  mono: true
  description: Basis-Verzeichnis für neue Repositories
  default: /mnt/borg

- key: borg_passphrase
  label: Borg Passphrase
  type: password
  placeholder: "leer lassen = nicht ändern"
  description: Globale Passphrase für alle Repositories (Fernet-verschlüsselt gespeichert)
