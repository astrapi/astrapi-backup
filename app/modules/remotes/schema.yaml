id_field: id
fields:
  - name:        description
    type:        text
    label:       Beschreibung
    max:         100
    column:      1
    row:         1

  - name:        mac
    type:        text
    label:       MAC-Adresse
    placeholder: "aa:bb:cc:dd:ee:ff"
    max:         17
    column:      1
    row:         2

  - name:        host
    type:        text
    label:       Hostname / IP
    placeholder: "server.lan"
    max:         100
    column:      2
    row:         2

  - name:        ssh_user
    type:        text
    label:       SSH-Benutzer
    placeholder: "root"
    max:         100
    column:      2
    row:         3

  - name:        enabled
    type:        boolean
    label:       Aktiviert
    column:      2
    row:         1
