4:
  enabled: true
  description: nextcloud.simpsons.lan
  source_host: nextcloud.simpsons.lan
  source_path: /backup
  target_host: backup01.simpsons.lan
  target_path: /storage/borg/cloud
  pre:
  - sudo -u www-data /usr/bin/php /var/www/nextcloud/occ maintenance:mode --on
  - sudo systemctl stop nginx
  - sudo mount -o bind /storage /backup/files
  - PGPASSWORD="nextcloud" pg_dump nextcloud -h localhost -U nextcloud -f /backup/database/nextcloud-sqlbkp_`date
    +"%Y%m%d"`.bak
  post:
  - sudo umount /backup/files
  - rm -rf /backup/database/*
  - sudo systemctl start nginx
  - sudo -u www-data /usr/bin/php /var/www/nextcloud/occ maintenance:mode --off
